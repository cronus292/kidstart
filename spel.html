<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f7fc">
<title>Spel · Kinderstart</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#f4f7fc;color:#18283e}
body{height:100vh;height:100dvh}
#app{position:fixed;inset:0;background:white;overflow:hidden}
#app:fullscreen{width:100%;height:100%;background:white}
#fullscreenNote{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#122c48;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;z-index:6;max-width:90%;text-align:center}#fullscreenNote[hidden]{display:none}
.viewer{position:absolute;inset:0;overflow:hidden;background:white}
#game{position:absolute;left:0;top:0;display:block;border:0;transform-origin:top left}
.toolbar{position:absolute;z-index:3;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.toolbar a,.toolbar button{pointer-events:auto;border:1px solid #d7bb67;border-radius:10px;background:#fff3ad;color:#3c3212;text-decoration:none;font-size:19px;font-weight:650;padding:0;width:36px;height:36px;min-width:36px;display:inline-flex;justify-content:center;align-items:center;line-height:1;box-shadow:0 1px 8px #0002} .toolbar a:focus-visible,.toolbar button:focus-visible{outline:3px solid #846400;outline-offset:2px}
.panel{position:absolute;z-index:4;top:calc(max(8px,env(safe-area-inset-top)) + 44px);right:max(8px,env(safe-area-inset-right));width:min(340px,calc(100% - 16px));background:#fffefb;border:1px solid #bcc8d5;border-radius:13px;padding:9px 11px;max-height:calc(100% - 78px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-x:hidden;overflow-y:scroll;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior-y:contain;box-shadow:0 4px 24px #0003;font-size:14px}
.panel[hidden]{display:none}.panel h2{font-size:15px;margin:0 0 3px}.panel p{margin:4px 0 12px;color:#46556a}.row{display:grid;grid-template-columns:1fr auto;gap:2px 6px;margin:6px 0}.row label{font-weight:600}.row input[type=range]{width:100%;accent-color:#1858a7;min-height:26px}.row .entry{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:6px;align-items:center}.row input[type=number]{width:100%;font:inherit;font-size:16px;padding:4px 5px;border:1px solid #9baec5;border-radius:8px;min-height:33px;text-align:right}.mode-label{font-weight:650;margin:0 0 4px}.state{font-size:10px;line-height:1.2;border-radius:5px;padding:3px 5px;margin:2px 0 5px;background:#e9f3ff;color:#203953}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}.panel-head .mode-label{margin:0}.reset-top{font:inherit;font-size:13px;border:1px solid #bdc8d7;border-radius:8px;background:#f6f9ff;padding:5px 9px;color:#173a73;margin:0;min-height:31px;white-space:nowrap}.actions{position:sticky;bottom:-9px;z-index:1;background:#fffefb;padding:7px 0 3px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:7px}.actions button,.actions a{font:inherit;border:1px solid #bdc8d7;border-radius:8px;background:#f6f9ff;padding:6px 3px;color:#173a73;text-decoration:none;font-size:11px;text-align:center;min-width:0;white-space:normal;overflow-wrap:break-word;line-height:1.15;display:flex;align-items:center;justify-content:center;min-height:40px}.actions .btn-ok{background:#15803d;border-color:#166534;color:#fff;font-weight:700}.actions .btn-reset{background:#b91c1c;border-color:#991b1b;color:#fff;font-weight:700}.actions .btn-try{background:#ea7600;border-color:#c45e00;color:#fff;font-weight:700}.reset-top{background:#163b70;border-color:#102c54;color:#fff;font-weight:700}.actions #direct{background:#374151;border-color:#1f2937;color:#fff;font-weight:700}.tip{font-size:12px;color:#566376}
#warning{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:white;padding:24px;text-align:center}#warning.visible{display:flex}
</style>
</head>
<body>
<div id="app">
<div class="viewer" id="viewer"><iframe id="game" title="Educatieve website" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
<div class="toolbar"><a id="back" href="kind1.html" title="Terug naar Kinderstart" aria-label="Terug naar Kinderstart">←</a><button id="full" type="button" title="Schermvullend" aria-label="Schermvullend">⛶</button><button id="settings" type="button" title="Weergave-instellingen" aria-label="Weergave-instellingen" aria-expanded="false" aria-controls="panel">⚙</button></div>
<section class="panel" id="panel" hidden aria-label="Weergave-instellingen">
<div class="panel-head"><div id="modeLabel" class="mode-label">Profiel: standaard</div><button id="rollback" class="reset-top" type="button">↶ Vorige</button></div>
<div class="state" id="safeStatus" role="status">De laatst bevestigde instellingen zijn actief.</div>
<div class="row"><label for="crop">Onderkant afsnijden</label><output id="cropValue">0 px</output><div class="entry"><input id="crop" type="range" min="0" max="450" step="5" value="0"><input type="number" id="cropNumber" min="0" max="450" step="1" value="0" aria-label="Waarde crop"></div></div>
<div class="row"><label for="topCrop">Bovenkant afsnijden</label><output id="topCropValue">0 px</output><div class="entry"><input id="topCrop" type="range" min="0" max="500" step="5" value="0"><input type="number" id="topCropNumber" min="0" max="500" step="1" value="0" aria-label="Waarde bovenkant afsnijden"></div></div>
<div class="row"><label for="leftCrop">Linkerkant afsnijden</label><output id="leftCropValue">0 px</output><div class="entry"><input id="leftCrop" type="range" min="0" max="450" step="5" value="0"><input type="number" id="leftCropNumber" min="0" max="450" step="1" value="0" aria-label="Waarde leftCrop"></div></div>
<div class="row"><label for="zoom">Iframe-zoom (uit- en inzoomen)</label><output id="zoomValue">100%</output><div class="entry"><input id="zoom" type="range" min="10" max="190" step="5" value="100"><input type="number" id="zoomNumber" min="10" max="190" step="1" value="100" aria-label="Waarde zoom"></div></div>
<div class="row"><label for="shift">Verticaal verschuiven (− omhoog, + omlaag)</label><output id="shiftValue">0 px</output><div class="entry"><input id="shift" type="range" min="-120" max="200" step="5" value="0"><input type="number" id="shiftNumber" min="-120" max="200" step="1" value="0" aria-label="Waarde shift"></div></div>
<div class="row"><label for="shiftX">Horizontaal verschuiven (− links, + rechts)</label><output id="shiftXValue">0 px</output><div class="entry"><input id="shiftX" type="range" min="-300" max="300" step="5" value="0"><input type="number" id="shiftXNumber" min="-300" max="300" step="1" value="0" aria-label="Waarde shiftX"></div></div>
<div class="actions"><button id="confirmSafe" class="btn-ok" type="button">Oke!</button><button id="reset" class="btn-reset" type="button">Reset</button><button id="close" class="btn-try" type="button">Try it!</button><a id="direct" href="#">Open ↗</a></div>
</section>
<div id="warning"><div><h2>Ongeldige spellink</h2><p>Open het spel via de Kinderstart-pagina.</p><a href="kind1.html" id="fallback">Terug</a></div></div>
<div id="fullscreenNote" role="status" hidden></div>
</div>
<script>
(()=>{'use strict';
const params=new URLSearchParams(location.search);
const child=/^[1-4]$/.test(params.get('kind')||'')?params.get('kind'):'1';
document.getElementById('back').href='kind'+child+'.html';
document.getElementById('fallback').href='kind'+child+'.html';
let url;
try{url=new URL(params.get('url')||'https://www.digipuzzle.net/minigames/build/build.htm?nolink=true');if(url.protocol!=='https:'||!['www.digipuzzle.net','digipuzzle.net','app.automatus.be','www.edugames.online','edugames.online'].includes(url.hostname))throw Error('URL niet toegestaan');}
catch(_){document.getElementById('warning').classList.add('visible');return;}
if(url.hostname.endsWith('digipuzzle.net')&&!url.searchParams.has('nolink'))url.searchParams.set('nolink','true');
document.getElementById('game').src=url.href;
document.getElementById('direct').href=url.href;
const game=document.getElementById('game'),viewer=document.getElementById('viewer'),panel=document.getElementById('panel'),settings=document.getElementById('settings');
const full=document.getElementById('full'),app=document.getElementById('app'),note=document.getElementById('fullscreenNote');
let noteTimer;function message(t){note.textContent=t;note.hidden=false;clearTimeout(noteTimer);noteTimer=setTimeout(()=>{note.hidden=true},3800)}
function currentFullscreen(){return document.fullscreenElement||document.webkitFullscreenElement}
// Ook op iPadOS zonder Fullscreen API kan tussen beide weergaveprofielen worden gewisseld.
const storePrefix='kinderstart_profiles_v2_'+url.origin+url.pathname+url.search;
const legacyKey='kinderstart_view_'+url.pathname;
const defaults={crop:0,topCrop:0,leftCrop:0,zoom:100,shift:0,shiftX:0};
const limits={crop:[0,450],topCrop:[0,500],leftCrop:[0,450],zoom:[10,190],shift:[-120,200],shiftX:[-300,300]};
function sanitize(obj){const result={};for(const k of Object.keys(defaults)){const n=Number(obj?.[k]);result[k]=Number.isFinite(n)?Math.round(Math.min(limits[k][1],Math.max(limits[k][0],n))):defaults[k]}return result}
function storageRead(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(_){return null}}
function storageWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){message('Opslaan mislukt: opslag is niet beschikbaar.');return false}}
const crop=document.getElementById('crop'),topCrop=document.getElementById('topCrop'),leftCrop=document.getElementById('leftCrop'),zoom=document.getElementById('zoom'),shift=document.getElementById('shift'),shiftX=document.getElementById('shiftX');
const controls={crop,topCrop,leftCrop,zoom,shift,shiftX};
const modeLabel=document.getElementById('modeLabel'),safeStatus=document.getElementById('safeStatus');
let mode='standard',requestedFullscreen=false;
let data=storageRead(storePrefix);
if(!data||data.version!==2){
 const legacy=storageRead(legacyKey);
 const initial=legacy&&typeof legacy==='object'?sanitize(legacy):{...defaults};
 data={version:2,standard:{safe:initial},fullscreen:{safe:{...initial}}};
 storageWrite(storePrefix,data);
}
for(const m of ['standard','fullscreen']){
 if(!data[m]||typeof data[m]!=='object')data[m]={safe:{...defaults}};
 data[m].safe=sanitize(data[m].safe);
 // Een onbevestigde test kan bij een crash zijn achtergebleven: nooit automatisch herstellen.
 if(data[m].pending)delete data[m].pending;
}
storageWrite(storePrefix,data);
let values={...data.standard.safe};
function setValues(o){values=sanitize(o);for(const k of Object.keys(controls)){controls[k].value=values[k];document.getElementById(k+'Number').value=values[k]}apply()}
function pending(){return JSON.stringify(values)!==JSON.stringify(data[mode].safe)}
function updateStatus(){const dirty=pending();safeStatus.textContent=dirty?'Testinstellingen actief. Klik op “Oke!” zodra het spel stabiel werkt. Bij opnieuw laden worden onbevestigde waarden verworpen.':'Laatst bevestigde, werkende instellingen actief.';modeLabel.textContent='Profiel: '+(mode==='standard'?'standaard':'schermvullend');document.getElementById('rollback').disabled=!dirty;document.getElementById('confirmSafe').disabled=!dirty}
function changeMode(next){if(mode===next)return;mode=next;setValues(data[mode].safe);updateStatus();updateFull()}
function updateFull(){const active=mode==='fullscreen';full.textContent=active?'⤢':'⛶';full.setAttribute('aria-label',active?'Standaardweergave':'Schermvullend');full.title=active?'Standaardweergave':'Schermvullend';setTimeout(apply,120)}
full.addEventListener('click',async()=>{
 if(mode==='fullscreen'){
  if(currentFullscreen()){try{if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}catch(_){}}
  requestedFullscreen=false;changeMode('standard');return;
 }
 // De gebruiker tikt op de knop: op ondersteunde browsers een geldige gebruikersactie.
 requestedFullscreen=true;changeMode('fullscreen');
 try{
  if(!currentFullscreen()){
   if(app.requestFullscreen)await app.requestFullscreen();
   else if(app.webkitRequestFullscreen)app.webkitRequestFullscreen();
  }
 }catch(_){message('De browser ondersteunt deze fullscreenaanvraag niet. Het schermvullende profiel is wel ingeschakeld.')}
});
function onFullChange(){if(!currentFullscreen()&&requestedFullscreen){requestedFullscreen=false;changeMode('standard')}else if(currentFullscreen()&&mode!=='fullscreen'){changeMode('fullscreen')}updateFull()}
document.addEventListener('fullscreenchange',onFullChange);
document.addEventListener('webkitfullscreenchange',onFullChange);
function apply(){
const c=Number(crop.value),tc=Number(topCrop.value),lc=Number(leftCrop.value),z=Number(zoom.value)/100,s=Number(shift.value),sx=Number(shiftX.value);
const w=viewer.clientWidth,h=viewer.clientHeight;
// Een kleinere schaal geeft Digipuzzle een bredere/ hogere virtuele viewport.
// Positieve verschuiving beweegt omlaag; negatieve verschuiving omhoog.
// Boven- en onderbijsnijden vergroten de virtuele iframe-hoogte; de bovenkant wordt buiten beeld geplaatst.
// Het iframe begint links buiten beeld met de ingestelde afsnijding.
// De breedte wordt aangepast zodat de rechterrand desondanks beschikbaar blijft.
game.style.width=(Math.max(1,w-sx+lc)/z)+'px';
game.style.height=(Math.max(1,h-s+tc+c)/z)+'px';
game.style.transform=`translate(${sx-lc}px, ${s-tc}px) scale(${z})`;
document.getElementById('cropValue').textContent=c+' px';
document.getElementById('topCropValue').textContent=tc+' px';
document.getElementById('leftCropValue').textContent=lc+' px';
document.getElementById('shiftXValue').textContent=(sx>0?'+':'')+sx+' px';
document.getElementById('zoomValue').textContent=Math.round(z*100)+'%';
document.getElementById('shiftValue').textContent=(s>0?'+':'')+s+' px';

}
// Synchroniseer schuifregelaar en handmatige invoer in beide richtingen.
[crop,topCrop,leftCrop,zoom,shift,shiftX].forEach(el=>{
 const number=document.getElementById(el.id+'Number');
 function updateFromSlider(){number.value=el.value;values[el.id]=Number(el.value);apply();updateStatus()}
 function updateFromNumber(){
  if(number.value.trim()==='')return;
  const value=Number(number.value);
  if(!Number.isFinite(value))return;
  const clamped=Math.max(Number(el.min),Math.min(Number(el.max),Math.round(value)));
  el.value=String(clamped);number.value=el.value;values[el.id]=Number(el.value);apply();updateStatus();
 }
 el.addEventListener('input',updateFromSlider);
 number.addEventListener('change',updateFromNumber);
 number.addEventListener('blur',()=>{number.value=el.value});
 number.value=el.value;
});
document.getElementById('reset').addEventListener('click',()=>{setValues(defaults);updateStatus()});
document.getElementById('rollback').addEventListener('click',()=>{setValues(data[mode].safe);updateStatus()});
document.getElementById('confirmSafe').addEventListener('click',()=>{
 // Er is geen API om de gezondheid van een extern iframe betrouwbaar te testen.
 // De gebruiker bevestigt expliciet dat deze instelling goed werkt.
 data[mode].safe=sanitize(values);
 storageWrite(storePrefix,data);updateStatus();message('Werkende instellingen voor '+(mode==='fullscreen'?'schermvullend':'standaard')+' bewaard.');
});
function showPanel(open){panel.hidden=!open;if(open)panel.scrollTop=0;settings.setAttribute('aria-expanded',String(open));}
settings.addEventListener('click',()=>showPanel(panel.hidden));document.getElementById('close').addEventListener('click',()=>showPanel(false));
window.addEventListener('resize',apply);setValues(data[mode].safe);updateStatus();
// Op iPadOS kan de Fullscreen API niet automatisch zonder gebruikersactie starten.
// De geïnstalleerde Kinderstart-webapp draait al zonder browserbalken.
})();
</script>
</body>
</html>
